name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: chickensoft-games/setup-godot@v2
        with: { version: 4.7.1-stable, use-dotnet: false, include-templates: true }

      - name: Godot import
        run: godot --headless --import

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/MyGame-debug.apk

      - name: Sign with debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APKSigner=$(find $ANDROID_HOME/build-tools -name apksigner -type f | head -n1)
          "$APKSigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out build/android/MyGame.apk build/android/MyGame-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyGame-APK
          path: build/android/*.apk

      - name: Create GitHub Release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.1.0-build${{ github.run_number }}"
          name: "MyGame v0.1.0 — Build ${{ github.run_number }}"
          files: |
            build/android/MyGame.apk
            build/android/MyGame-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
